<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prog Wi-Fi</title>
<style>
  body { font-family: sans-serif; margin: 1.5em; color: #222; }
  h1 { margin-bottom: .2em; }
  table { border-collapse: collapse; }
  th, td { text-align: left; padding: .3em .8em; border-bottom: 1px solid #ddd; }
  th { color: #555; font-weight: 600; }
  #status { margin: .6em 0; font-size: .9em; color: #555; }
  #status.error { color: #b00020; font-weight: 600; }
  #btn-refresh { padding: .45em .9em; font-size: .95em; }
  h2 { margin: 1.4em 0 .4em; font-size: 1.1em; }
  #admin-buttons button { margin: 0 .4em .5em 0; padding: .45em .9em; font-size: .95em; }
  #admin-buttons button.danger { color: #b00020; }
  #admin-msg { margin: .5em 0; font-size: .9em; color: #555; min-height: 1.2em; }
  #admin-msg.error { color: #b00020; font-weight: 600; }
  progress { width: 16em; }
</style>
</head>
<body>
<h1>Prog Wi-Fi</h1>
<button type="button" id="btn-refresh">Refresh</button>
<div id="status" role="status" aria-live="polite">Loading...</div>
<table>
  <tbody id="rows"></tbody>
</table>

<h2>Admin</h2>
<div id="admin-msg" role="status" aria-live="polite">Actions ask for the admin user and password.</div>
<progress id="admin-progress" max="100" value="0" hidden aria-label="Update progress"></progress>
<div id="admin-buttons">
  <button type="button" id="btn-console">Enable log console</button>
  <button type="button" id="btn-check">Check for updates</button>
  <button type="button" id="btn-update">Update firmware</button>
  <button type="button" id="btn-reboot">Reboot</button>
  <button type="button" id="btn-format" class="danger">Erase settings (NVS)</button>
</div>

<script>
(function () {
  "use strict";

  // Value shown when a field is missing or null.
  function or(v, fallback) { return (v === null || v === undefined || v === "") ? fallback : v; }

  function fmtUptime(s) {
    var d = Math.floor(s / 86400);
    var h = Math.floor(s / 3600) % 24;
    var m = Math.floor(s / 60) % 60;
    var sec = s % 60;
    function p(n) { return (n < 10 ? "0" : "") + n; }
    return d + "d " + p(h) + ":" + p(m) + ":" + p(sec);
  }

  function ifaceRows(label, n) {
    if (!n) { return [[label, "not available"]]; }
    return [
      [label + " MAC", or(n.mac, "-")],
      [label + " IP", or(n.ip, "no IP")]
    ];
  }

  // Builds the list of [label, value] rows from the /info JSON.
  function buildRows(i) {
    var rows = [];
    rows.push(["Project", or(i.project, "-")]);
    rows.push(["Firmware version", or(i.version, "-")]);
    rows.push(["Build", or(i.build, "-")]);
    rows.push(["ESP-IDF", or(i.idf, "-")]);
    rows.push(["Hardware version", or(i.hw_version, "-")]);
    rows.push(["Running partition", or(i.partition, "-")]);

    var w = i.wifi || {};
    if (w.enabled === false) {
      rows.push(["Wi-Fi", "DISABLED (WIFI_ENABLED = 0 in firmware)"]);
    } else {
      rows = rows.concat(ifaceRows("Wi-Fi", w.iface));
      rows.push(["Wi-Fi SSID", w.ssid ? w.ssid + " (" + w.rssi + " dBm)" : "not connected"]);
    }
    rows = rows.concat(ifaceRows("Ethernet", i.ethernet));
    if (i.ethernet) {
      var e = i.ethernet;
      rows.push(["Ethernet link", e.link_up ? (or(e.speed_mbps, "?") + " Mbps, " + or(e.duplex, "?") + " duplex") : "down"]);
    }

    rows.push(["Uptime", typeof i.uptime_s === "number" ? fmtUptime(i.uptime_s) : "-"]);

    rows.push(["CPU usage", typeof i.cpu_percent === "number" ? i.cpu_percent.toFixed(1) + "%" : "measuring..."]);

    var pu = i.partition_usage;
    if (pu && typeof pu.used_kb === "number") {
      rows.push(["Partition usage", pu.used_kb + " / " + pu.total_kb + " KB (" + pu.percent.toFixed(1) + "%)"]);
    } else if (pu) {
      rows.push(["Partition usage", "size " + pu.total_kb + " KB (used unknown)"]);
    }

    var h = i.heap || {};
    rows.push(["Free heap", or(h.free, "-") + " bytes (min " + or(h.min_free, "-") + ")"]);
    rows.push(["DMA heap", or(h.dma_free, "-") + " bytes free (min " + or(h.dma_min_free, "-") + ", largest block " + or(h.dma_largest, "-") + ")"]);
    rows.push(["Reset reason", or(i.reset_reason, "-")]);
    rows.push(["Boot count", or(i.boot_count, "-")]);
    rows.push(["Panic/watchdog reboots", or(i.panic_count, "-")]);
    rows.push(["Firmware state", or(i.ota_state, "-")]);

    var t = i.test_run || {};
    rows.push(["Test run", or(t.status_text, "-")]);
    if (t.id !== null && t.id !== undefined) { rows.push(["Test run id", String(t.id)]); }
    return rows;
  }

  function render(rows) {
    var tbody = document.getElementById("rows");
    while (tbody.firstChild) { tbody.removeChild(tbody.firstChild); }
    rows.forEach(function (r) {
      var tr = document.createElement("tr");
      var th = document.createElement("th");
      var td = document.createElement("td");
      th.textContent = r[0];   // textContent: never interpreted as HTML
      td.textContent = String(r[1]);
      tr.appendChild(th);
      tr.appendChild(td);
      tbody.appendChild(tr);
    });
  }

  function setStatus(text, isError) {
    var el = document.getElementById("status");
    el.textContent = text;
    el.className = isError ? "error" : "";
  }

  function refresh() {
    fetch("/info", { cache: "no-store" })
      .then(function (res) {
        if (!res.ok) { throw new Error("HTTP " + res.status); }
        return res.json();
      })
      .then(function (info) {
        render(buildRows(info));
        setStatus("Loaded " + new Date().toLocaleTimeString(), false);
      })
      .catch(function (err) {
        setStatus("Could not load device info: " + err.message, true);
      });
  }

  // ---- Admin actions (HTTP Basic auth: the browser asks for the credentials) ----
  var adminButtons = document.querySelectorAll("#admin-buttons button");
  var progressEl = document.getElementById("admin-progress");

  function adminMsg(text, isError) {
    var el = document.getElementById("admin-msg");
    el.textContent = text;
    el.className = isError ? "error" : "";
  }

  function setBusy(busy) {
    for (var k = 0; k < adminButtons.length; k++) { adminButtons[k].disabled = busy; }
    if (!busy) { progressEl.hidden = true; }
  }

  // POST with the X-Admin header the device requires. Resolves {status, ok, text, json}.
  function adminPost(path) {
    return fetch(path, { method: "POST", headers: { "X-Admin": "1" }, cache: "no-store" })
      .then(function (res) {
        return res.text().then(function (t) {
          var j = null;
          try { j = JSON.parse(t); } catch (e) { j = null; }
          return { status: res.status, ok: res.ok, text: t, json: j };
        });
      });
  }

  function replyText(r) {
    if (r.status === 401) { return "Authentication required (wrong or missing credentials)."; }
    if (r.json && r.json.message) { return r.json.message; }
    return r.text ? r.text.trim() : "HTTP " + r.status;
  }

  // Poll /admin/status until the running operation finishes.
  function pollAdmin() {
    fetch("/admin/status", { cache: "no-store" })
      .then(function (res) {
        if (!res.ok) { throw new Error("HTTP " + res.status); }
        return res.json();
      })
      .then(function (s) {
        if (s.op !== "idle") {
          if (s.op === "updating") {
            progressEl.hidden = false;
            progressEl.value = s.progress;
            adminMsg("Updating firmware... " + s.progress + "%", false);
          } else {
            adminMsg("Working: " + s.op + "...", false);
          }
          setTimeout(pollAdmin, 1000);
          return;
        }
        var msg = (s.last && s.last.message) ? s.last.message : "Done.";
        if (s.staged) { msg += " (Firmware " + s.staged_version + " is installed: reboot to run it.)"; }
        adminMsg(msg, !!(s.last && !s.last.ok));
        setBusy(false);
        refresh();
      })
      .catch(function (err) {
        adminMsg("Lost contact with the device: " + err.message, true);
        setBusy(false);
      });
  }

  // After reboot/format: wait until the device answers again.
  function waitForDevice() {
    fetch("/info", { cache: "no-store" })
      .then(function (res) {
        if (!res.ok) { throw new Error("HTTP " + res.status); }
        adminMsg("Device is back.", false);
        setBusy(false);
        refresh();
      })
      .catch(function () { setTimeout(waitForDevice, 2000); });
  }

  function runJob(path, startedText) {
    setBusy(true);
    adminMsg(startedText, false);
    adminPost(path).then(function (r) {
      if (r.status === 202) { setTimeout(pollAdmin, 500); return; }
      adminMsg(replyText(r), true);
      setBusy(false);
    }).catch(function (err) {
      adminMsg("Request failed: " + err.message, true);
      setBusy(false);
    });
  }

  function runRestart(path, startedText) {
    setBusy(true);
    adminMsg(startedText, false);
    adminPost(path).then(function (r) {
      if (r.ok) {
        adminMsg(replyText(r) + ". Waiting for the device...", false);
        setTimeout(waitForDevice, 3000);
        return;
      }
      adminMsg(replyText(r), true);
      setBusy(false);
    }).catch(function (err) {
      adminMsg("Request failed: " + err.message, true);
      setBusy(false);
    });
  }

  document.getElementById("btn-refresh").addEventListener("click", refresh);

  document.getElementById("btn-console").addEventListener("click", function () {
    setBusy(true);
    // POST /console answers with plain text (port + time window).
    adminPost("/console").then(function (r) {
      adminMsg(replyText(r), !r.ok);
      setBusy(false);
    }).catch(function (err) {
      adminMsg("Request failed: " + err.message, true);
      setBusy(false);
    });
  });

  document.getElementById("btn-check").addEventListener("click", function () {
    runJob("/admin/update/check", "Checking for updates...");
  });

  document.getElementById("btn-update").addEventListener("click", function () {
    if (!confirm("Download and install the newest firmware (if any)?\nIt only runs after a reboot.")) { return; }
    runJob("/admin/update/apply", "Starting update...");
  });

  document.getElementById("btn-reboot").addEventListener("click", function () {
    if (!confirm("Reboot the device now?")) { return; }
    runRestart("/admin/reboot", "Rebooting...");
  });

  document.getElementById("btn-format").addEventListener("click", function () {
    if (!confirm("ERASE all saved settings (NVS), e.g. a static IP, and reboot?\nThe device may come back with a different IP address.")) { return; }
    runRestart("/admin/format?confirm=yes", "Erasing settings...");
  });

  refresh();
})();
</script>
</body>
</html>
