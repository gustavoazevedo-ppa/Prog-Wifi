<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prog Wi-Fi</title>
<style>
  body { font-family: sans-serif; margin: 1.5em; color: #222; }
  h1 { margin-bottom: .2em; }
  table { border-collapse: collapse; }
  th, td { text-align: left; padding: .3em .8em; border-bottom: 1px solid #ddd; }
  th { color: #555; font-weight: 600; }
  #status { margin: .6em 0; font-size: .9em; color: #555; }
  #status.error { color: #b00020; font-weight: 600; }
</style>
</head>
<body>
<h1>Prog Wi-Fi</h1>
<div id="status" role="status" aria-live="polite">Loading...</div>
<table>
  <tbody id="rows"></tbody>
</table>

<script>
(function () {
  "use strict";

  // Value shown when a field is missing or null.
  function or(v, fallback) { return (v === null || v === undefined || v === "") ? fallback : v; }

  function fmtUptime(s) {
    var d = Math.floor(s / 86400);
    var h = Math.floor(s / 3600) % 24;
    var m = Math.floor(s / 60) % 60;
    var sec = s % 60;
    function p(n) { return (n < 10 ? "0" : "") + n; }
    return d + "d " + p(h) + ":" + p(m) + ":" + p(sec);
  }

  function ifaceRows(label, n) {
    if (!n) { return [[label, "not available"]]; }
    return [
      [label + " MAC", or(n.mac, "-")],
      [label + " IP", or(n.ip, "no IP")]
    ];
  }

  // Builds the list of [label, value] rows from the /info JSON.
  function buildRows(i) {
    var rows = [];
    rows.push(["Project", or(i.project, "-")]);
    rows.push(["Firmware version", or(i.version, "-")]);
    rows.push(["Build", or(i.build, "-")]);
    rows.push(["ESP-IDF", or(i.idf, "-")]);
    rows.push(["Hardware version", or(i.hw_version, "-")]);
    rows.push(["Running partition", or(i.partition, "-")]);

    var w = i.wifi || {};
    if (w.enabled === false) {
      rows.push(["Wi-Fi", "DISABLED (WIFI_ENABLED = 0 in firmware)"]);
    } else {
      rows = rows.concat(ifaceRows("Wi-Fi", w.iface));
      rows.push(["Wi-Fi SSID", w.ssid ? w.ssid + " (" + w.rssi + " dBm)" : "not connected"]);
    }
    rows = rows.concat(ifaceRows("Ethernet", i.ethernet));

    rows.push(["Uptime", typeof i.uptime_s === "number" ? fmtUptime(i.uptime_s) : "-"]);

    rows.push(["CPU usage", typeof i.cpu_percent === "number" ? i.cpu_percent.toFixed(1) + "%" : "measuring..."]);

    var pu = i.partition_usage;
    if (pu && typeof pu.used_kb === "number") {
      rows.push(["Partition usage", pu.used_kb + " / " + pu.total_kb + " KB (" + pu.percent.toFixed(1) + "%)"]);
    } else if (pu) {
      rows.push(["Partition usage", "size " + pu.total_kb + " KB (used unknown)"]);
    }

    var h = i.heap || {};
    rows.push(["Free heap", or(h.free, "-") + " bytes (min " + or(h.min_free, "-") + ")"]);
    rows.push(["Reset reason", or(i.reset_reason, "-")]);

    var t = i.test_run || {};
    rows.push(["Test run", or(t.status_text, "-")]);
    if (t.id !== null && t.id !== undefined) { rows.push(["Test run id", String(t.id)]); }
    return rows;
  }

  function render(rows) {
    var tbody = document.getElementById("rows");
    while (tbody.firstChild) { tbody.removeChild(tbody.firstChild); }
    rows.forEach(function (r) {
      var tr = document.createElement("tr");
      var th = document.createElement("th");
      var td = document.createElement("td");
      th.textContent = r[0];   // textContent: never interpreted as HTML
      td.textContent = String(r[1]);
      tr.appendChild(th);
      tr.appendChild(td);
      tbody.appendChild(tr);
    });
  }

  function setStatus(text, isError) {
    var el = document.getElementById("status");
    el.textContent = text;
    el.className = isError ? "error" : "";
  }

  function refresh() {
    fetch("/info", { cache: "no-store" })
      .then(function (res) {
        if (!res.ok) { throw new Error("HTTP " + res.status); }
        return res.json();
      })
      .then(function (info) {
        render(buildRows(info));
        setStatus("Loaded " + new Date().toLocaleTimeString(), false);
      })
      .catch(function (err) {
        setStatus("Could not load device info: " + err.message, true);
      });
  }

  refresh();
})();
</script>
</body>
</html>
